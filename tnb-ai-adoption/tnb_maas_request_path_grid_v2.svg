<text x="292.0" y="1299.1" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">4. Kuadrant → maas-api</text>
<text x="314.5" y="1325.5" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— validate API key</text>
<text x="292.0" y="1359.2" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">5. maas-api → MaaSSubscription + MaaSAuthPolicy</text>
<text x="313.1" y="1385.6" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— check subscription/tier</text>
<text x="1892.0" y="1118.6" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">6. MaaSSubscription + MaaSAuthPolicy → LLMInferenceService (RTX 6000 Pro)</text>
<text x="1913.9" y="1145.0" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— authorize (free-tier-maas group) + route</text>
<text x="1892.0" y="1178.7" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">7. MaaSSubscription + MaaSAuthPolicy → LLMInferenceService (2x H200)</text>
<text x="1911.0" y="1205.1" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— authorize + route</text>
<text x="1892.0" y="1238.9" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">8. ODF S3 → LLMInferenceService (RTX 6000 Pro)</text>
<text x="1913.7" y="1265.3" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— pull weights</text>
<text x="1892.0" y="1299.1" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">9. ODF S3 → LLMInferenceService (2x H200)</text>
<text x="1913.8" y="1325.5" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— pull weights</text>
<text x="1892.0" y="1359.2" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">10. LLMInferenceService (2x H200) → Prometheus + Thanos + Grafana</text>
