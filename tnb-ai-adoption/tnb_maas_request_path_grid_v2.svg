<text x="292.0" y="1178.7" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">2. MetalLB LoadBalancer → Gateway API</text>
<text x="312.9" y="1205.1" font-family="Red Hat Text" font-weight="400" font-size="18" fill="#5A5A5A" text-anchor="start">— TLS terminate (cert-manager cert)</text>
<text x="292.0" y="1238.9" font-family="Red Hat Text" font-weight="500" font-size="20" fill="#1F1F1F" text-anchor="start">3. Gateway API → Kuadrant (Authorino + Limitador)</text>
