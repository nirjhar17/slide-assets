<text x="210.0" y="818.8" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">2. MetalLB LoadBalancer → Gateway API</text>
<text x="226.7" y="839.3" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— TLS terminate (cert-manager cert)</text>
<text x="210.0" y="868.5" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">3. Gateway API → Kuadrant (Authorino + Limitador)</text>
<text x="227.1" y="889.0" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— AuthPolicy + RateLimitPolicy</text>
<text x="210.0" y="918.2" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">4. Kuadrant → maas-api</text>
<text x="228.0" y="938.6" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— validate API key</text>
<text x="210.0" y="967.8" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">5. maas-api → MaaSSubscription + MaaSAuthPolicy</text>
<text x="226.9" y="988.3" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— check subscription/tier</text>
<text x="1385.0" y="769.1" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">6. MaaSSubscription + MaaSAuthPolicy → LLMInferenceService (RTX 6000 Pro)</text>
<text x="1402.5" y="789.6" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— authorize (free-tier-maas group) + route</text>
<text x="1385.0" y="818.8" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">7. MaaSSubscription + MaaSAuthPolicy → LLMInferenceService (2x H200)</text>
<text x="1400.2" y="839.3" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— authorize + route</text>
<text x="1385.0" y="868.5" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">8. ODF S3 → LLMInferenceService (RTX 6000 Pro)</text>
<text x="1402.4" y="889.0" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— pull weights</text>
<text x="1385.0" y="918.2" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">9. ODF S3 → LLMInferenceService (2x H200)</text>
<text x="1402.4" y="938.6" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— pull weights</text>
<text x="1385.0" y="967.8" font-family="Red Hat Text" font-weight="500" font-size="16" fill="#1F1F1F" text-anchor="start">10. LLMInferenceService (2x H200) → Prometheus + Thanos + Grafana</text>
<text x="1408.5" y="988.3" font-family="Red Hat Text" font-weight="400" font-size="15" fill="#5A5A5A" text-anchor="start">— vLLM /metrics → Prometheus → Thanos → Grafana</text>
